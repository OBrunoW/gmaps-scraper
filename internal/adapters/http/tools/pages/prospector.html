<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospector</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1c1f24;--muted:#5d6672;--border:#d5d9e0;--accent:#1a73e8;--accent-text:#fff;--danger:#c62828;--ok:#2e7d32;--code:#eef0f3}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2025;--text:#e6e8eb;--muted:#9aa3ae;--border:#343a42;--accent:#6ea8fe;--accent-text:#0b1220;--danger:#ef8a8a;--ok:#7fd48a;--code:#14161a}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;overflow-x:hidden}
main{max-width:960px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 12px}
nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
a{color:var(--accent)}
.muted{color:var(--muted)}
section{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
input,select{width:100%;min-width:0;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto}
button{padding:8px 16px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-text);font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
pre{margin:0;padding:12px;background:var(--code);border-radius:6px;overflow:auto;max-height:360px;white-space:pre-wrap;word-break:break-word;font-size:.8rem}
.error{color:var(--danger)}
.ok{color:var(--ok)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;word-break:break-word}
ul{margin:0;padding-left:20px}
.details{margin:12px 0 0}
.details dt{font-size:.85rem;color:var(--muted);margin-top:10px}
.details dd{margin:2px 0 0;word-break:break-word}
.details dd div{margin-bottom:4px}
</style>
</head>
<body>
<main>
<h1>Prospector</h1>
<nav>
<a href="scrape.html">Scrape</a>
<a href="prospector.html">Prospector</a>
<a href="lead-learning.html">Lead learning</a>
</nav>
<section>
<h2>Configuração</h2>
<div class="grid">
<label>URL base<input id="baseUrl" type="url" autocomplete="off"></label>
<label>Header da chave<select id="keyHeader"><option value="X-Service-Key">X-Service-Key</option><option value="X-Api-Key">X-Api-Key</option></select></label>
<label>Chave<input id="apiKey" type="password" autocomplete="off"></label>
</div>
</section>
<section>
<h2>Criar busca</h2>
<form id="form">
<div class="grid">
<label>Palavra-chave (obrigatória)<input id="keyword" required></label>
<label>CEP (substitui cidade, UF e endereço)<input id="cep" inputmode="numeric" maxlength="9" autocomplete="off"></label>
<label>Cidade (obrigatória sem CEP)<input id="city" required></label>
<label>UF (obrigatória sem CEP)<input id="uf" maxlength="2" required></label>
<label>Rua<input id="street"></label>
<label>Número<input id="number"></label>
<label>Bairro<input id="neighborhood"></label>
<label>Raio em km (radius_km)<input id="radiusKm" type="number" min="0" step="any"></label>
</div>
<div class="actions">
<button id="submit" type="submit">Buscar leads</button>
<span id="status" class="muted"></span>
</div>
</form>
</section>
<section>
<h2>Consultar CEP</h2>
<form id="cepForm">
<div class="grid">
<label>CEP<input id="cepLookup" inputmode="numeric" maxlength="9" autocomplete="off" required></label>
</div>
<div class="actions">
<button id="cepSubmit" type="submit">Consultar</button>
<span id="cepStatus" class="muted"></span>
</div>
</form>
<dl id="cepResult" class="details"></dl>
</section>
<section>
<h2>Consultar CNPJ</h2>
<form id="cnpjForm">
<div class="grid">
<label>CNPJ<input id="cnpj" inputmode="numeric" maxlength="18" autocomplete="off" required></label>
</div>
<div class="actions">
<button id="cnpjSubmit" type="submit">Consultar</button>
<span id="cnpjStatus" class="muted"></span>
</div>
</form>
<dl id="cnpjResult" class="details"></dl>
</section>
<section>
<h2>Leads</h2>
<div class="scroll">
<table>
<thead><tr><th>Título</th><th>Telefone</th><th>Site</th><th>Endereço</th><th>Categoria</th><th>Maps</th></tr></thead>
<tbody id="leads"></tbody>
</table>
</div>
</section>
<section>
<h2>Coordenadas</h2>
<ul id="coordinates"></ul>
</section>
<section>
<h2>Resposta crua</h2>
<pre id="raw">Nenhuma resposta ainda.</pre>
</section>
</main>
<script>
const STORAGE = { baseUrl: 'gmaps_tools_base_url', apiKey: 'gmaps_tools_key', keyHeader: 'gmaps_tools_key_header' };
const baseUrlInput = document.getElementById('baseUrl');
const apiKeyInput = document.getElementById('apiKey');
const keyHeaderSelect = document.getElementById('keyHeader');

function readStored(name) {
  try {
    return window.localStorage.getItem(name) || '';
  } catch (error) {
    return '';
  }
}

function writeStored(name, value) {
  try {
    window.localStorage.setItem(name, value);
  } catch (error) {
    return;
  }
}

function loadConfig() {
  baseUrlInput.value = readStored(STORAGE.baseUrl) || window.location.origin;
  apiKeyInput.value = readStored(STORAGE.apiKey);
  const header = readStored(STORAGE.keyHeader);
  if (header) keyHeaderSelect.value = header;
}

function saveConfig() {
  writeStored(STORAGE.baseUrl, baseUrlInput.value.trim());
  writeStored(STORAGE.apiKey, apiKeyInput.value);
  writeStored(STORAGE.keyHeader, keyHeaderSelect.value);
}

function apiUrl(path) {
  return baseUrlInput.value.trim().replace(/\/+$/, '') + path;
}

function authHeaders() {
  const headers = { 'Content-Type': 'application/json' };
  headers[keyHeaderSelect.value] = apiKeyInput.value;
  return headers;
}

function hasConfig() {
  return baseUrlInput.value.trim() !== '' && apiKeyInput.value !== '';
}

function bindConfig(onChange) {
  loadConfig();
  [baseUrlInput, apiKeyInput, keyHeaderSelect].forEach(function (element) {
    element.addEventListener('input', function () {
      saveConfig();
      onChange();
    });
  });
  onChange();
}

async function requestJson(method, path, body) {
  const response = await fetch(apiUrl(path), {
    method: method,
    headers: authHeaders(),
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  const text = await response.text();
  let payload = null;
  try {
    payload = text ? JSON.parse(text) : null;
  } catch (error) {
    payload = { message: text };
  }
  return { ok: response.ok, status: response.status, payload: payload };
}

function describeError(result) {
  const payload = result.payload || {};
  const code = payload.code ? ' [' + payload.code + ']' : '';
  return 'HTTP ' + result.status + code + ': ' + (payload.message || 'erro sem mensagem');
}

function pretty(value) {
  return JSON.stringify(value, null, 2);
}

const POLL_INTERVAL_MS = 2000;
const POLL_LIMIT_MS = 6 * 60 * 1000;
const FINAL_STATUSES = ['completed', 'failed'];
const form = document.getElementById('form');
const submitButton = document.getElementById('submit');
const statusLabel = document.getElementById('status');
const rawOutput = document.getElementById('raw');
const leadsBody = document.getElementById('leads');
const coordinatesList = document.getElementById('coordinates');
let pollTimer = null;

function setStatus(text, isError) {
  statusLabel.textContent = text;
  statusLabel.className = isError ? 'error' : 'muted';
}

function stopPolling() {
  if (pollTimer) clearTimeout(pollTimer);
  pollTimer = null;
}

function readText(id) {
  return document.getElementById(id).value.trim();
}

function onlyDigits(value) {
  return value.replace(/\D/g, '');
}

function buildBody() {
  const cep = onlyDigits(readText('cep'));
  if (cep !== '') {
    const cepBody = { keyword: readText('keyword'), cep: cep };
    if (readText('radiusKm') !== '') cepBody.radius_km = Number(readText('radiusKm'));
    return cepBody;
  }
  const body = {
    keyword: readText('keyword'),
    city: readText('city'),
    uf: readText('uf').toUpperCase()
  };
  const address = {};
  if (readText('street')) address.street = readText('street');
  if (readText('number')) address.number = readText('number');
  if (readText('neighborhood')) address.neighborhood = readText('neighborhood');
  if (Object.keys(address).length > 0) body.address = address;
  if (readText('radiusKm') !== '') body.radius_km = Number(readText('radiusKm'));
  return body;
}

function textCell(row, value) {
  const cell = document.createElement('td');
  cell.textContent = value || '';
  row.appendChild(cell);
}

function isSafeUrl(url) {
  return typeof url === 'string' && /^https?:\/\//i.test(url.trim());
}

function linkCell(row, url, label) {
  const cell = document.createElement('td');
  if (isSafeUrl(url)) {
    const anchor = document.createElement('a');
    anchor.href = url.trim();
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';
    anchor.textContent = label;
    cell.appendChild(anchor);
  } else if (url) {
    cell.textContent = label;
  }
  row.appendChild(cell);
}

function renderLeads(leads) {
  leadsBody.textContent = '';
  coordinatesList.textContent = '';
  if (!Array.isArray(leads) || leads.length === 0) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 6;
    cell.className = 'muted';
    cell.textContent = 'Nenhum lead encontrado.';
    row.appendChild(cell);
    leadsBody.appendChild(row);
    return;
  }
  leads.forEach(function (lead) {
    const row = document.createElement('tr');
    textCell(row, lead.title);
    textCell(row, lead.phone);
    linkCell(row, lead.website, lead.website);
    textCell(row, lead.address);
    textCell(row, lead.category);
    linkCell(row, lead.maps_url, 'abrir');
    leadsBody.appendChild(row);
    if (typeof lead.lat === 'number' && typeof lead.lng === 'number') {
      const item = document.createElement('li');
      item.textContent = (lead.title || lead.key || 'lead') + ': ' + lead.lat.toFixed(6) + ', ' + lead.lng.toFixed(6);
      coordinatesList.appendChild(item);
    }
  });
}

async function poll(jobId, startedAt) {
  if (Date.now() - startedAt > POLL_LIMIT_MS) {
    setStatus('Tempo esgotado após 6 minutos.', true);
    submitButton.disabled = !hasConfig();
    return;
  }
  try {
    const result = await requestJson('GET', '/api/v1/prospector/jobs/' + encodeURIComponent(jobId));
    rawOutput.textContent = pretty(result.payload);
    if (!result.ok) {
      setStatus(describeError(result), true);
      submitButton.disabled = !hasConfig();
      return;
    }
    const job = result.payload || {};
    const failureText = job.error ? ': ' + job.error : '';
    setStatus('Status: ' + job.status + ' (' + (job.result_count || 0) + ' resultados)' + failureText, job.status === 'failed');
    if (FINAL_STATUSES.indexOf(job.status) !== -1) {
      if (job.status === 'completed') renderLeads(job.leads);
      submitButton.disabled = !hasConfig();
      return;
    }
  } catch (error) {
    setStatus('Falha de rede: ' + error.message, true);
    submitButton.disabled = !hasConfig();
    return;
  }
  pollTimer = setTimeout(function () { poll(jobId, startedAt); }, POLL_INTERVAL_MS);
}

form.addEventListener('submit', async function (event) {
  event.preventDefault();
  stopPolling();
  submitButton.disabled = true;
  leadsBody.textContent = '';
  coordinatesList.textContent = '';
  setStatus('Criando job...', false);
  try {
    const result = await requestJson('POST', '/api/v1/prospector/jobs', buildBody());
    rawOutput.textContent = pretty(result.payload);
    if (!result.ok) {
      setStatus(describeError(result), true);
      submitButton.disabled = !hasConfig();
      return;
    }
    poll(result.payload.job_id, Date.now());
  } catch (error) {
    setStatus('Falha de rede: ' + error.message, true);
    submitButton.disabled = !hasConfig();
  }
});

function syncLocationRequirement() {
  const hasCep = onlyDigits(readText('cep')) !== '';
  document.getElementById('city').required = !hasCep;
  document.getElementById('uf').required = !hasCep;
}

document.getElementById('cep').addEventListener('input', syncLocationRequirement);

const cepForm = document.getElementById('cepForm');
const cepSubmit = document.getElementById('cepSubmit');
const cepStatus = document.getElementById('cepStatus');
const cepResult = document.getElementById('cepResult');
const cnpjForm = document.getElementById('cnpjForm');
const cnpjSubmit = document.getElementById('cnpjSubmit');
const cnpjStatus = document.getElementById('cnpjStatus');
const cnpjResult = document.getElementById('cnpjResult');

function setLookupStatus(label, text, isError) {
  label.textContent = text;
  label.className = isError ? 'error' : 'muted';
}

function addDetail(list, title, lines) {
  const values = (Array.isArray(lines) ? lines : [lines]).filter(function (line) {
    return line !== undefined && line !== null && line !== '';
  });
  const term = document.createElement('dt');
  term.textContent = title;
  list.appendChild(term);
  const description = document.createElement('dd');
  if (values.length === 0) {
    description.className = 'muted';
    description.textContent = 'Não informado';
  }
  values.forEach(function (line) {
    const row = document.createElement('div');
    row.textContent = line;
    description.appendChild(row);
  });
  list.appendChild(description);
}

function joinParts(parts, separator) {
  return parts.filter(function (part) { return part; }).join(separator);
}

function formatActivity(activity) {
  if (!activity) return '';
  return joinParts([activity.code, activity.description], ' - ');
}

function formatAddress(address) {
  const street = joinParts([address.street, address.number], ', ');
  const place = joinParts([address.neighborhood, joinParts([address.city, address.state], '/')], ', ');
  return joinParts([street, address.complement, place, address.cep], ' | ');
}

function formatPhone(phone) {
  const suffix = joinParts([phone.type, phone.whatsapp ? 'WhatsApp' : ''], ', ');
  return phone.number + (suffix ? ' (' + suffix + ')' : '');
}

function formatPartner(partner) {
  return joinParts([partner.name, partner.role, partner.document, partner.start_date], ' | ');
}

function renderCnpj(company) {
  cnpjResult.textContent = '';
  addDetail(cnpjResult, 'CNPJ', company.cnpj);
  addDetail(cnpjResult, 'Razão social', company.legal_name);
  addDetail(cnpjResult, 'Nome fantasia', company.trade_name);
  addDetail(cnpjResult, 'Situação', company.registration_status);
  addDetail(cnpjResult, 'CNAE principal', formatActivity(company.main_activity));
  addDetail(cnpjResult, 'Natureza jurídica', company.legal_nature);
  addDetail(cnpjResult, 'Porte', company.size);
  addDetail(cnpjResult, 'Endereços', (company.addresses || []).map(formatAddress));
  addDetail(cnpjResult, 'Telefones', (company.phones || []).map(formatPhone));
  addDetail(cnpjResult, 'E-mails', company.emails || []);
  addDetail(cnpjResult, 'Sócios', (company.partners || []).map(formatPartner));
}

function renderCep(location) {
  cepResult.textContent = '';
  addDetail(cepResult, 'CEP', location.cep);
  addDetail(cepResult, 'Logradouro', location.street);
  addDetail(cepResult, 'Bairro', location.neighborhood);
  addDetail(cepResult, 'Cidade', location.city);
  addDetail(cepResult, 'UF', location.state);
}

async function runLookup(options) {
  options.button.disabled = true;
  options.result.textContent = '';
  setLookupStatus(options.label, 'Consultando...', false);
  try {
    const result = await requestJson('GET', options.path);
    rawOutput.textContent = pretty(result.payload);
    if (!result.ok) {
      setLookupStatus(options.label, describeError(result), true);
      return;
    }
    setLookupStatus(options.label, 'Consulta concluída.', false);
    options.render(result.payload || {});
  } catch (error) {
    setLookupStatus(options.label, 'Falha de rede: ' + error.message, true);
  } finally {
    options.button.disabled = !hasConfig();
  }
}

cepForm.addEventListener('submit', function (event) {
  event.preventDefault();
  const cep = onlyDigits(document.getElementById('cepLookup').value);
  if (cep.length !== 8) {
    setLookupStatus(cepStatus, 'Informe um CEP com 8 dígitos.', true);
    return;
  }
  runLookup({ button: cepSubmit, result: cepResult, label: cepStatus, path: '/api/v1/prospector/cep/' + cep, render: renderCep });
});

cnpjForm.addEventListener('submit', function (event) {
  event.preventDefault();
  const cnpj = onlyDigits(document.getElementById('cnpj').value);
  if (cnpj.length !== 14) {
    setLookupStatus(cnpjStatus, 'Informe um CNPJ com 14 dígitos.', true);
    return;
  }
  runLookup({ button: cnpjSubmit, result: cnpjResult, label: cnpjStatus, path: '/api/v1/prospector/cnpj/' + cnpj, render: renderCnpj });
});

bindConfig(function () {
  if (!pollTimer) submitButton.disabled = !hasConfig();
  cepSubmit.disabled = !hasConfig();
  cnpjSubmit.disabled = !hasConfig();
});
</script>
</body>
</html>
